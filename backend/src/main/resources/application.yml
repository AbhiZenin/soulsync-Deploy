spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  application:
    name: soulsync-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/soulsync}
    username: ${DATABASE_USERNAME:soulsync}
    password: ${DATABASE_PASSWORD:soulsync_dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "mail.smtp.auth": ${MAIL_SMTP_AUTH:false}
      "mail.smtp.starttls.enable": ${MAIL_STARTTLS:false}
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

soulsync:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET:change-me-in-production-change-me-in-production-32}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:30}

  uploads-dir: ${UPLOADS_DIR:./uploads}

  storage:
    provider: ${PHOTO_STORAGE_PROVIDER:local}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}

  dev-mode: ${DEV_MODE:true}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:no-reply@soulsync.local}
  seed-demo: ${SEED_DEMO:true}

  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}

  sms:
    provider: ${SMS_PROVIDER:dev}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}